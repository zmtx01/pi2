<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase de Ícones Neon de Acessibilidade</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0a0f14;
            --text-color: #c0d0d8;
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1.5rem;
            margin-bottom: 40px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .grade-testes {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }

        .card-opcao {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 25px;
            border: 1px solid #1e2933;
            border-radius: 12px;
            background: var(--card-bg);
            width: 160px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card-opcao:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border-color: #334455;
        }

        /* Área do Ícone */
        .icone-wrapper {
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Efeito de brilho no fundo do botão (opcional) */
        .icone-wrapper::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
        }

        svg {
            width: 64px;
            height: 64px;
            z-index: 1;
            /* O filtro é aplicado inline no SVG para flexibilidade de cor */
        }

        .legenda-opcao {
            font-size: 0.85rem;
            text-align: center;
            color: #8da1ad;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Variação de Cores nas Legendas para combinar com o ícone */
        .text-blue { color: var(--neon-blue); text-shadow: 0 0 5px rgba(0, 243, 255, 0.5); }
        .text-pink { color: var(--neon-pink); text-shadow: 0 0 5px rgba(255, 0, 255, 0.5); }
        .text-green { color: var(--neon-green); text-shadow: 0 0 5px rgba(57, 255, 20, 0.5); }

    </style>
</head>
<body>

    <!-- DEFINIÇÃO DOS FILTROS DE NEON (O "Segredo" do brilho) -->
    <svg style="position: absolute; width: 0; height: 0;" aria-hidden="true">
        <defs>
            <!-- Filtro Brilho Suave (Ciano) -->
            <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                <feFlood flood-color="#00f3ff" result="glowColor" />
                <feComposite in="glowColor" in2="coloredBlur" operator="in" result="softGlow_colored" />
                <feMerge>
                    <feMergeNode in="softGlow_colored"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <!-- Filtro Brilho Intenso (Magenta) -->
            <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                <feFlood flood-color="#ff00ff" result="glowColor" />
                <feComposite in="glowColor" in2="coloredBlur" operator="in" result="softGlow_colored" />
                <feMerge>
                    <feMergeNode in="softGlow_colored"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <!-- Filtro Brilho Tech (Verde) -->
            <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
                <feFlood flood-color="#39ff14" result="glowColor" />
                <feComposite in="glowColor" in2="coloredBlur" operator="in" result="softGlow_colored" />
                <feMerge>
                    <feMergeNode in="softGlow_colored"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>
    </svg>

    <h2>Icones Neon v2.0</h2>

    <div class="grade-testes">

        <!-- OPÇÃO 1: STROKE CLÁSSICO (Ciano) -->
        <!-- Estilo: Tubo oco, look clássico de neon -->
        <div class="card-opcao">
            <div class="icone-wrapper">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" filter="url(#glow-blue)">
                    <!-- Grupo para definir cor e estilo do traço -->
                    <g fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Cabeça -->
                        <circle cx="14.2" cy="4.2" r="2"/>
                        <!-- Corpo e Braço (Simplificado para traço) -->
                        <path d="M13.1 7 H15 C15.5 7 15.9 7.3 16.1 7.8 L17.2 11 H20 C20.55 11 21 11.45 21 12 C21 12.55 20.55 13 20 13 H16.4 C15.95 13 15.55 12.7 15.4 12.25 L14.65 10.15 L13.5 13.2 L16.1 16.1 C16.45 16.5 16.4 17.1 16 17.45 C15.6 17.8 15 17.75 14.65 17.35 L11.35 13.8 C10.9 13.3 10.75 12.6 11 11.95 L12.5 8.1 H11.2 L10.2 10.8 C10 11.3 9.4 11.55 8.9 11.35 C8.4 11.15 8.15 10.55 8.35 10.05 L9.75 6.95 C9.95 6.5 10.4 6.2 10.9 6.2 H12.1 C12.5 6.2 12.85 6.5 13.1 7 Z"/>
                        <!-- Perna -->
                        <path d="M14.65 17.1 L12.8 19.1 C12.45 19.5 11.85 19.5 11.5 19.15 C11.15 18.8 11.15 18.2 11.5 17.85 L13.1 16.1 Z"/>
                        <!-- Roda -->
                        <circle cx="9" cy="17" r="4.8"/>
                        <!-- Estrutura -->
                        <path d="M9 13.2 H14.2 C14.75 13.2 15.2 13.65 15.2 14.2 C15.2 14.75 14.75 15.2 14.2 15.2 H10.2 L8.4 17.4 L7.1 16.35 Z"/>
                    </g>
                </svg>
            </div>
            <div class="legenda-opcao text-blue">Neon<br>Tubular</div>
        </div>

        <!-- OPÇÃO 2: FILLED GLOW (Magenta) -->
        <!-- Estilo: Sólido, imita gás ionizado brilhando por dentro -->
        <div class="card-opcao">
            <div class="icone-wrapper">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" filter="url(#glow-pink)">
                    <g fill="#ff00ff" stroke="none">
                        <!-- Cabeça -->
                        <circle cx="14.2" cy="4.2" r="2.1"/>
                        <!-- Corpo (Mesmo path, mas com fill) -->
                        <path d="M13.1 7 H15 C15.5 7 15.9 7.3 16.1 7.8 L17.2 11 H20 C20.55 11 21 11.45 21 12 C21 12.55 20.55 13 20 13 H16.4 C15.95 13 15.55 12.7 15.4 12.25 L14.65 10.15 L13.5 13.2 L16.1 16.1 C16.45 16.5 16.4 17.1 16 17.45 C15.6 17.8 15 17.75 14.65 17.35 L11.35 13.8 C10.9 13.3 10.75 12.6 11 11.95 L12.5 8.1 H11.2 L10.2 10.8 C10 11.3 9.4 11.55 8.9 11.35 C8.4 11.15 8.15 10.55 8.35 10.05 L9.75 6.95 C9.95 6.5 10.4 6.2 10.9 6.2 H12.1 C12.5 6.2 12.85 6.5 13.1 7 Z"/>
                        <!-- Perna -->
                        <path d="M14.65 17.1 L12.8 19.1 C12.45 19.5 11.85 19.5 11.5 19.15 C11.15 18.8 11.15 18.2 11.5 17.85 L13.1 16.1 Z"/>
                        <!-- Roda -->
                        <circle cx="9" cy="17" r="4.8"/>
                        <!-- Estrutura -->
                        <path d="M9 13.2 H14.2 C14.75 13.2 15.2 13.65 15.2 14.2 C15.2 14.75 14.75 15.2 14.2 15.2 H10.2 L8.4 17.4 L7.1 16.35 Z"/>
                    </g>
                </svg>
            </div>
            <div class="legenda-opcao text-pink">Plasma<br>Sólido</div>
        </div>

        <!-- OPÇÃO 3: DIGITAL MATRIX (Verde) -->
        <!-- Estilo: Tracejado, look de dados/processamento -->
        <div class="card-opcao">
            <div class="icone-wrapper">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" filter="url(#glow-green)">
                    <g fill="none" stroke="#39ff14" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="2 1">
                        <!-- Cabeça (Dash menor para ficar mais redondo) -->
                        <circle cx="14.2" cy="4.2" r="2" stroke-dasharray="0"/>
                        <!-- Corpo -->
                        <path d="M13.1 7 H15 C15.5 7 15.9 7.3 16.1 7.8 L17.2 11 H20 C20.55 11 21 11.45 21 12 C21 12.55 20.55 13 20 13 H16.4 C15.95 13 15.55 12.7 15.4 12.25 L14.65 10.15 L13.5 13.2 L16.1 16.1 C16.45 16.5 16.4 17.1 16 17.45 C15.6 17.8 15 17.75 14.65 17.35 L11.35 13.8 C10.9 13.3 10.75 12.6 11 11.95 L12.5 8.1 H11.2 L10.2 10.8 C10 11.3 9.4 11.55 8.9 11.35 C8.4 11.15 8.15 10.55 8.35 10.05 L9.75 6.95 C9.95 6.5 10.4 6.2 10.9 6.2 H12.1 C12.5 6.2 12.85 6.5 13.1 7 Z"/>
                        <!-- Perna -->
                        <path d="M14.65 17.1 L12.8 19.1 C12.45 19.5 11.85 19.5 11.5 19.15 C11.15 18.8 11.15 18.2 11.5 17.85 L13.1 16.1 Z"/>
                        <!-- Roda -->
                        <circle cx="9" cy="17" r="4.8"/>
                        <!-- Estrutura -->
                        <path d="M9 13.2 H14.2 C14.75 13.2 15.2 13.65 15.2 14.2 C15.2 14.75 14.75 15.2 14.2 15.2 H10.2 L8.4 17.4 L7.1 16.35 Z"/>
                    </g>
                </svg>
            </div>
            <div class="legenda-opcao text-green">Matrix<br>Digital</div>
        </div>

    </div>
</body>
</html>
