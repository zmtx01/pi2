<!-- pi2/templates/index.html                                  -->
<!-- ========================================================= -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- 1. METADADOS E CARREGAMENTO HÍBRIDO DO CSS -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário de um Estagiário - CTI/SEMAE</title>

    <script>
        const _baseStatic = window.location.protocol === 'file:' ? '../static/' : '/static/';
        document.write('<link rel="stylesheet" href="' + _baseStatic + 'css/ace_icone.css">');
    </script>

    <!-- 2. ESTILOS VISUAIS DA TELA -->
    <style>
        :root {
            --cor-fundo: #000000;
            --cor-texto: #5FDCF2;
            --cor-destaque: #FF9F1C;
            --cor-sucesso: #45CF8A;
        }

        body {
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            font-family: 'Consolas', 'SF Mono', 'DejaVu Sans Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            position: relative;
            user-select: none;
        }

        .terminal-box {
            width: 100%;
            max-width: 650px;
            min-height: 280px;
            background-color: #051520;
            border: 2px solid var(--cor-texto);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(95, 220, 242, 0.15);
            box-sizing: border-box;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .terminal-box.visivel { opacity: 1; }
        .terminal-line { margin: 12px 0; white-space: pre-wrap; line-height: 1.6; outline: none; }
        .sub-titulo { font-size: 1.1rem; margin-bottom: 25px; outline: none; }

        .input-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }
        .input-box span { user-select: none; }

        input[type="text"] {
            background: transparent;
            border: none;
            color: var(--cor-destaque);
            font-family: inherit;
            font-size: 1rem;
            width: 220px;
            text-align: center;
            outline: none;
            border-bottom: 2px dashed var(--cor-texto);
            padding: 2px 5px;
        }

        button {
            background: transparent;
            border: none;
            color: var(--cor-sucesso);
            font-family: inherit;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px 15px;
            margin-top: 15px;
            border-radius: 4px;
            outline: none;
            transition: color 0.2s;
        }

        button:hover {
            color: #ffffff;
        }

        body.teclado-ativo button,
        button:focus {
            border: 1px solid var(--cor-sucesso);
            background: rgba(69, 207, 138, 0.1);
        }

        .btn-iniciar-turno {
            background: transparent !important;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            color: var(--cor-sucesso);
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 25px;
            transition: color 0.2s;
            white-space: nowrap !important;
            padding: 8px 0 !important;
        }

        .btn-iniciar-turno:hover {
            color: #ffffff;
        }

        body.teclado-ativo .btn-iniciar-turno,
        body.teclado-ativo .btn-iniciar-turno:focus {
            border: 1px solid var(--cor-sucesso) !important;
            background: rgba(69, 207, 138, 0.1) !important;
            outline: 2px solid #FF9F1C !important;
            outline-offset: 3px !important;
        }

        .footer-ascii {
            position: absolute;
            bottom: 30px;
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 1px;
            width: 100%;
        }

        #progress-bar { color: var(--cor-destaque); margin-top: 5px; font-weight: bold; }
        .text-left { text-align: left; }

        .header-externo {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 12vh;
            outline: none;
        }

        .titulo-jogo {
            color: var(--cor-destaque);
            font-weight: bold;
            letter-spacing: 1px;
            margin: 30px 0;
            font-size: 4.3rem;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- 3. CABEÇALHO DO JOGO -->
    <div class="header-externo" id="cabecalho-principal">
        <div id="div-sup"></div>
        <div class="titulo-jogo" id="titulo-texto" tabindex="1" data-fala="Título: Diário de um Estagiário."></div>
        <div id="div-inf"></div>
    </div>

    <!-- 4. TERMINAL CENTRAL -->
    <div class="terminal-box" id="terminal">
        <div id="screen-1">
            <div class="terminal-line sub-titulo" id="subtitulo-texto" tabindex="2" data-fala="Seção: Primeiro Dia de Trabalho.">PRIMEIRO DIA <span class="tag-acessivel">[FASE INICIAL]</span></div>
            <div class="terminal-line" id="label-nome" tabindex="3" data-fala="Instrução: Digite seu nome:">Digite seu nome:</div>

            <div id="form-area">
                <div class="input-box">
                    <span>[</span>
                    <input type="text" id="username" autocomplete="off" maxlength="20" tabindex="4" data-fala="Campo para digitar o seu nome." />
                    <span>]</span>
                </div>
                <div>
                    <button id="btn-entrar" tabindex="5" data-fala="Botão Entrar. Pressione enter para começar o turno.">[ ENTRAR ] <span class="tag-acessivel">[CONFIRMAR]</span></button>
                </div>
            </div>
        </div>

        <div id="screen-2" style="display: none;"></div>
    </div>

    <!-- 5. PAINEL E WIDGET DE ACESSIBILIDADE (COM TRAVA DISPLAY NONE INLINE) -->
    <div class="painel-gaveta-opcoes" id="painel-opcoes" style="display: none;">
        <div class="painel-cabecalho">
            <span>RECURSOS DE ACESSIBILIDADE</span>
            <span class="btn-fechar-painel" onclick="alternarPainelA11y(false)">[ESC] FECHAR</span>
        </div>

        <div class="painel-corpo-opcoes">
            <div class="item-opcao-acessibilidade" id="item-voz" tabindex="7" onclick="alternarOpcaoA11y('voz')">
                <div class="item-info"><span>🔊</span><span>Leitura por Voz</span></div>
                <div class="badge-status" id="badge-voz">DESLIGADO</div>
            </div>
            <div class="item-opcao-acessibilidade" id="item-teclado" tabindex="8" onclick="alternarOpcaoA11y('teclado')">
                <div class="item-info"><span>⌨️</span><span>Navegação Teclado</span></div>
                <div class="badge-status" id="badge-teclado">DESLIGADO</div>
            </div>
            <div class="item-opcao-acessibilidade" id="item-icones" tabindex="9" onclick="alternarOpcaoA11y('icones')">
                <div class="item-info"><span>🔤</span><span>Ícones & Destaques</span></div>
                <div class="badge-status" id="badge-icones">DESLIGADO</div>
            </div>
        </div>

        <div class="painel-rodape-dica">
            [ Pressione ESC para retornar ao login ]
        </div>
    </div>

    <div class="widget-acessibilidade" id="widget-acessibilidade">
        <div class="caixa-gatilho-acessibilidade" id="gatilho-acessibilidade" tabindex="6" role="button" data-fala="Menu de Acessibilidade. Pressione Alt mais A para abrir.">
            <div class="btn-icone-grande" id="container-icone">♿</div>
            <div class="bloco-mensagens">
                <span class="msg-linha1">ACESSIBILIDADE</span>
                <span class="msg-linha2">[ALT + A]</span>
            </div>
        </div>
    </div>

    <!-- 6. BARRA ASCI NO RODAPÉ -->
    <div class="footer-ascii" id="conexao-ascii">
        <div id="progress-status">CONECTANDO AO HOST...</div>
        <div id="progress-bar">[░░░░░░░░░░] 0%</div>
    </div>

    <!-- 7. LÓGICA DO JOGO -->
    <script>
        if (window.location.protocol !== 'file:') {
            if (!sessionStorage.getItem('aba_ativa')) {
                window.location.href = '/logout';
            }
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));
        let skipTyping = false;

        document.addEventListener('click', (event) => {
            if (event.detail === 3) skipTyping = true;
        });

        function typeText(element, text, speed) {
            return new Promise(resolve => {
                let i = 0;
                function type() {
                    if (skipTyping) {
                        element.innerHTML += text.substring(i);
                        resolve();
                        return;
                    }
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        async function printLineSlow(container, text, speed = 20, alignClass = 'text-left') {
            const div = document.createElement('div');
            div.className = `terminal-line ${alignClass}`;
            container.appendChild(div);
            await typeText(div, text, speed);
            if (!skipTyping) await sleep(150);
        }

        async function printEstagiarioLine(container, name, speed = 25) {
            const div = document.createElement('div');
            div.className = 'terminal-line text-left';
            container.appendChild(div);

            const labelSpan = document.createElement('span');
            div.appendChild(labelSpan);
            await typeText(labelSpan, "Estagiário: ", speed);

            const nameSpan = document.createElement('span');
            nameSpan.style.color = 'var(--cor-destaque)';
            nameSpan.style.fontWeight = 'bold';
            div.appendChild(nameSpan);
            await typeText(nameSpan, name, speed);

            if (!skipTyping) await sleep(150);
        }

        async function rodarBarraAscii() {
            const bar = document.getElementById('progress-bar');
            const status = document.getElementById('progress-status');
            const frames = [
                { text: '[░░░░░░░░░░] 0%', delay: 250 },
                { text: '[██░░░░░░░░] 20%', delay: 300 },
                { text: '[█████░░░░░] 50%', delay: 250 },
                { text: '[████████░░] 80%', delay: 300 },
                { text: '[██████████] 100%', delay: 400 }
            ];

            for (let frame of frames) {
                if (skipTyping) {
                    bar.innerHTML = '[██████████] 100%';
                    break;
                }
                bar.innerHTML = frame.text;
                await sleep(frame.delay);
            }
            status.innerHTML = 'CONEXÃO ESTÁVEL - HUB SEMAE';
            status.style.color = 'var(--cor-sucesso)';
        }

        async function iniciarPagina1() {
            const baseImg = window.location.protocol === 'file:' ? '../static/img/' : '/static/img/';
            const imgsParaBaixar = ['sala.png', 'mesa.png', 'mesa2.png'];
            imgsParaBaixar.forEach(arq => {
                const imgOculta = new Image();
                imgOculta.src = baseImg + arq;
            });

            if (window.location.protocol !== 'file:') {
                if (!sessionStorage.getItem('aba_ativa')) {
                    window.location.href = '/logout';
                    return;
                }
            }

            if (window.location.protocol !== 'file:') {
                try {
                    const response = await fetch('/api/my-progress');
                    if (response.ok) {
                        const data = await response.json();
                        if (data.progresso >= 1) {
                            localStorage.setItem('nomeEstagiario', data.username_jogo);
                            window.location.href = "/pi2/mesa";
                            return;
                        }
                    }
                } catch (e) {
                    console.error("Erro ao verificar progresso:", e);
                }
            }

            skipTyping = false;

            const divSup = document.getElementById('div-sup');
            const tituloTexto = document.getElementById('titulo-texto');
            const divInf = document.getElementById('div-inf');

            divSup.innerHTML = '';
            tituloTexto.innerHTML = '';
            divInf.innerHTML = '';

            rodarBarraAscii();

            await typeText(divSup, "==================================================================================================", 5);
            if (!skipTyping) await sleep(150);

            await typeText(tituloTexto, "DIÁRIO DE UM ESTAGIÁRIO", 20);
            if (!skipTyping) await sleep(150);

            await typeText(divInf, "==================================================================================================", 5);
            if (!skipTyping) await sleep(150);

            const terminal = document.getElementById('terminal');
            terminal.classList.add('visivel');

            const widget = document.getElementById('widget-acessibilidade');
            if (widget) {
                widget.style.opacity = '1';
                widget.style.pointerEvents = 'auto';
            }

            const input = document.getElementById('username');
        const btn = document.getElementById('btn-entrar');

        let enviandoFormulario = false; // TRAVA 1: Impede disparos múltiplos no Enter

        const enviarFormulario = () => {
            if (enviandoFormulario) return;

            const name = input.value.trim();
            if (name) {
                enviandoFormulario = true;
                btn.disabled = true;
                input.disabled = true;

                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                carregarTela2(name);
            } else {
                input.style.borderColor = '#E04A5F';
                setTimeout(() => input.style.borderColor = 'var(--cor-texto)', 1000);
            }
        };

        btn.addEventListener('click', enviarFormulario);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarFormulario();
        });
    }

    async function carregarTela2(name) {
        localStorage.setItem('nomeEstagiario', name);
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();

        // 1. ESCONDE O WIDGET E CABEÇALHOS NO MILISSEGUNDO ZERO
        const widget = document.getElementById('widget-acessibilidade');
        if (widget) widget.style.display = 'none';

        document.getElementById('cabecalho-principal').style.display = 'none';
        document.getElementById('conexao-ascii').style.display = 'none';

        // 2. TROCA DE TELA IMEDIATAMENTE (SEM ATRASO DE REDE)
        const screen1 = document.getElementById('screen-1');
        const screen2 = document.getElementById('screen-2');
        
        screen1.style.display = 'none';
        screen2.style.display = 'block';
        screen2.innerHTML = ''; 

        // 3. ENVIO EM SEGUNDO PLANO (SEM AWAIT: NÃO CONGELA A TELA)
        if (window.location.protocol !== 'file:') {
            fetch('/api/save-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    progresso: 1, 
                    estrelas: 0, 
                    username_jogo: name 
                })
            }).catch(() => {});
        }

        skipTyping = false; 

        if (typeof falarTexto === 'function') {
            falarTexto(`Carregando perfil. Estagiário: ${name}. Setor: Tecnologia da Informação. Cargo: Estagiário de T.I. Status: Novo Estagiário.`, 'teclado');
        }

        // 4. DIGITAÇÃO DAS LINHAS DE PERFIL
        await printLineSlow(screen2, "CARREGANDO PERFIL...", 25);
        await printEstagiarioLine(screen2, name, 25);
        await printLineSlow(screen2, "Setor: Tecnologia da Informação", 25);
        await printLineSlow(screen2, "Cargo: Estagiário de TI", 25);
        await printLineSlow(screen2, "Status:", 25);
        await printLineSlow(screen2, "NOVO ESTAGIÁRIO", 25);

        const btnTurno = document.createElement('button');
        btnTurno.id = 'btn-iniciar-turno';
        btnTurno.className = 'btn-iniciar-turno';
        btnTurno.tabIndex = 1;
        btnTurno.setAttribute('data-fala', 'Botão: Pressione qualquer tecla ou clique para iniciar o seu turno...');
        btnTurno.textContent = '[ Pressione qualquer tecla ou clique para iniciar o seu turno... ]';
        screen2.appendChild(btnTurno);
        btnTurno.focus();

        let transicaoIniciada = false;

        function avancar(e) {
            if (e) e.preventDefault();
            if (transicaoIniciada) return;
            transicaoIniciada = true;

            btnTurno.disabled = true;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.removeEventListener('keydown', teclaAvancar);
            btnTurno.removeEventListener('click', avancar);
            carregarTela3(); 
        }

        function teclaAvancar(e) {
            avancar(e);
        }

        btnTurno.addEventListener('click', avancar);
        setTimeout(() => {
            document.addEventListener('keydown', teclaAvancar);
        }, 300);
    }

        function carregarTela3() {
            document.body.style.transition = 'opacity 0.5s ease-in-out';
            document.body.style.opacity = '0';
            
            setTimeout(() => {
                if (window.location.protocol === 'file:') {
                    window.location.href = "sala.html"; 
                } else {
                    window.location.href = "/pi2/sala"; 
                }
            }, 500);
        }

        window.onload = iniciarPagina1;
    </script>

    <!-- 8. CARREGAMENTO HÍBRIDO DO JS DE ACESSIBILIDADE -->
    <script>
        document.write('<script src="' + _baseStatic + 'js/ace_index.js"><\/script>');
    </script>
</body>
</html>
